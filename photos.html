  <link rel="icon"

  <!-- Load FontAwesome (for icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
    crossorigin="anonymous" />

  <!-- Dark mode script -->
  <script>
    // Check for saved theme preference, otherwise use system preference
    const getPreferredTheme = () => {
      const savedTheme = localStorage.getItem('theme')
      if (savedTheme) {
        return savedTheme
      }
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    }

    // Apply theme to document
    const setTheme = (theme) => {
      document.documentElement.setAttribute('data-theme', theme)
      localStorage.setItem('theme', theme)
    }

    // Set initial theme
    setTheme(getPreferredTheme())
  </script>

  <!-- Photo manifest, generated by scripts/process_photos.py -->
  <script src="photos/collections.js"></script>
</head>

<body>
  <!-- Dark mode toggle button -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
    <i class="fas fa-moon"></i>
  </button>

  <main class="photos-page">
    <header>
      <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Charles Zhang</a>
      <h1>Photos</h1>
    </header>

    <section id="collections"></section>
  </main>

  <dialog id="lightbox" aria-label="Photo viewer"><img alt="" /></dialog>

  <!-- Photo collections script -->
  <script>
    const WIDTHS = [640, 1280, 2400]
    const collectionsEl = document.getElementById('collections')
    const lightbox = document.getElementById('lightbox')
    const lightboxImg = lightbox.querySelector('img')

    const GAP = 4 // Must match the gap in .photo-grid / .photo-row
    const MAX_PER_ROW = 8

    const srcset = (slug, photo) =>
      WIDTHS.map(w => `photos/${slug}/${photo.name}-${w}.webp ${w}w`).join(', ')

    // Height a row needs so its photos exactly fill the width
    const rowHeight = (ratios, width) =>
      (width - GAP * (ratios.length - 1)) / ratios.reduce((a, b) => a + b)

    // Choose row breaks (like line-breaking text) so every row fills the full
    // width and row heights stay as close as possible to the target
    const justify = (ratios, width, target) => {
      const best = [{ cost: 0, start: 0 }]
      for (let end = 1; end <= ratios.length; end++) {
        best[end] = { cost: Infinity, start: 0 }
        for (let start = end - 1; start >= Math.max(0, end - MAX_PER_ROW); start--) {
          const height = rowHeight(ratios.slice(start, end), width)
          if (height <= 0) break
          const cost = best[start].cost + Math.log(height / target) ** 2
          if (cost < best[end].cost) best[end] = { cost, start }
        }
      }
      const rows = []
      for (let end = ratios.length; end > 0; end = best[end].start) {
        rows.unshift([best[end].start, end])
      }
      return rows
    }

    const layout = (grid, imgs, ratios) => {
      const width = grid.clientWidth
      if (width === 0 || width === grid.lastWidth) return
      grid.lastWidth = width
      const target = parseFloat(getComputedStyle(grid).getPropertyValue('--row-height'))

      grid.replaceChildren(...justify(ratios, width, target).map(([start, end]) => {
        const row = document.createElement('div')
        row.className = 'photo-row'
        const height = rowHeight(ratios.slice(start, end), width)
        row.style.height = `${height}px`
        imgs.slice(start, end).forEach((img, k) => {
          img.sizes = `${Math.ceil(height * ratios[start + k])}px`
          row.appendChild(img)
        })
        return row
      }))
    }

    // Build one collapsible section per collection
    const collections = typeof PHOTO_COLLECTIONS === 'undefined' ? [] : PHOTO_COLLECTIONS
    if (collections.length === 0) {
      collectionsEl.innerHTML = '<p class="subtitle">Coming soon.</p>'
    }

    collections.forEach((collection, i) => {
      const details = document.createElement('details')
      details.className = 'collection'
      details.open = i === 0

      const count = `${collection.photos.length} photo${collection.photos.length === 1 ? '' : 's'}`
      details.innerHTML = `
        <summary>
          <span class="collection-title">${collection.title}</span>
          <span class="collection-meta">${collection.subtitle ? collection.subtitle + ' · ' : ''}${count}</span>
          <i class="fas fa-chevron-down"></i>
        </summary>
        <div class="photo-grid"></div>`

      const grid = details.querySelector('.photo-grid')
      const ratios = collection.photos.map(photo => photo.w / photo.h)
      const imgs = collection.photos.map((photo, j) => {
        const img = document.createElement('img')
        img.srcset = srcset(collection.slug, photo)
        img.sizes = `${Math.ceil(ratios[j] * 200)}px`
        img.alt = ''
        img.loading = 'lazy'
        img.decoding = 'async'
        img.style.setProperty('--ar', ratios[j])
        img.style.backgroundColor = photo.color
        img.addEventListener('click', () => openLightbox(collection, j))
        return img
      })

      collectionsEl.appendChild(details)

      // Re-tile whenever the width changes (resize, or the section is first opened)
      new ResizeObserver(() => layout(grid, imgs, ratios)).observe(grid)
    })

    // Lightbox: shows the already-loaded thumbnail underneath while the full-size version loads
    let current = null

    const showPhoto = (collection, index) => {
      const photo = collection.photos[index]
      current = { collection, index }
      lightboxImg.removeAttribute('srcset')
      lightboxImg.style.setProperty('--ar', photo.w / photo.h)
      lightboxImg.style.backgroundColor = photo.color
      lightboxImg.style.backgroundImage = `url(photos/${collection.slug}/${photo.name}-640.webp)`
      lightboxImg.sizes = '90vw'
      lightboxImg.srcset = srcset(collection.slug, photo)

      // Preload neighbors so arrow-key navigation is instant
      ;[index - 1, index + 1].forEach(k => {
        const neighbor = collection.photos[k]
        if (!neighbor) return
        const preload = new Image()
        preload.sizes = '90vw'
        preload.srcset = srcset(collection.slug, neighbor)
      })
    }

    const openLightbox = (collection, index) => {
      showPhoto(collection, index)
      lightbox.showModal()
    }

    lightbox.addEventListener('click', () => lightbox.close())

    document.addEventListener('keydown', (event) => {
      if (!lightbox.open || !current) return
      const step = { ArrowLeft: -1, ArrowRight: 1 }[event.key]
      const next = current.index + (step || 0)
      if (step && next >= 0 && next < current.collection.photos.length) {
        showPhoto(current.collection, next)
      }
    })
  </script>

  <!-- Theme toggle script -->
  <script>
    const themeToggle = document.getElementById('theme-toggle')
    const themeIcon = themeToggle.querySelector('i')

    // Update button icon based on current theme
    const updateIcon = () => {
      const theme = document.documentElement.getAttribute('data-theme')
      themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon'
    }

    // Initialize icon
    updateIcon()

    // Handle toggle click
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme')
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark'
      setTheme(newTheme)
      updateIcon()
    })
  </script>

  <!-- Boid Simulation Script -->
  <script src="boids.js" data-calm></script>
</body>

</html>
